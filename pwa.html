<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日本語 Flash">
<meta name="theme-color" content="#f7f4ee">
<title>日本語 Flash</title>

<!-- Inline manifest via data URI for single-file PWA -->
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%E6%97%A5%E6%9C%AC%E8%AA%9E%20Flash%22%2C%22short_name%22%3A%22%E6%97%A5%E6%9C%AC%E8%AA%9E%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f7f4ee%22%2C%22theme_color%22%3A%22%23f7f4ee%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%2520viewBox%3D'0%25200%2520100%2520100'%253E%253Crect%2520width%3D'100'%2520height%3D'100'%2520fill%3D'%25231a1a1a'%2F%253E%253Ctext%2520y%3D'.9em'%2520font-size%3D'70'%2520x%3D'10'%253E%25E8%25AA%259E%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22any%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">

<!-- iOS home screen icon (inline SVG → data URI) -->
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231a1a1a'/><text y='.85em' font-size='62' x='8' fill='%23f7f4ee' font-family='serif'>語</text></svg>">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --ink:       #1a1a1a;
    --ink-soft:  #4a4a4a;
    --ink-mute:  #9a9a9a;
    --paper:     #f7f4ee;
    --paper-2:   #efebd8;
    --rule:      #d8d2be;
    --red:       #c0392b;
    --green:     #27635a;
    --accent:    #8b5e3c;
    --tab-h:     60px;
    --safe-b:    env(safe-area-inset-bottom, 0px);
    --safe-t:    env(safe-area-inset-top, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden; /* we scroll inside .view-scroll */
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    display: flex;
    flex-direction: column;
  }

  /* ── TOP HEADER (iOS status bar safe area) ── */
  .app-header {
    background: var(--paper);
    border-bottom: 2px solid var(--ink);
    padding: calc(var(--safe-t) + 0.7rem) 1.2rem 0.7rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-shrink: 0;
    z-index: 50;
  }
  .app-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .app-title span { color: var(--accent); }
  .app-subtitle {
    font-size: 0.72rem;
    color: var(--ink-mute);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 0.05rem;
  }

  /* ── SCROLLABLE CONTENT AREA ── */
  .view-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: calc(var(--tab-h) + var(--safe-b) + 1.5rem);
  }

  /* ── VIEWS ── */
  .view { display: none; padding: 1.4rem 1rem; }
  .view.active { display: block; }

  /* ── BOTTOM TAB BAR ── */
  .tab-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: calc(var(--tab-h) + var(--safe-b));
    background: var(--paper);
    border-top: 2px solid var(--ink);
    display: flex;
    align-items: flex-start;
    padding-bottom: var(--safe-b);
    z-index: 100;
  }
  .tab-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.25rem;
    height: var(--tab-h);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--ink-mute);
    transition: color 0.15s;
    padding: 0;
  }
  .tab-btn.active { color: var(--ink); }
  .tab-icon { font-size: 1.3rem; line-height: 1; }
  .tab-label {
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }
  .tab-btn.active .tab-label { font-weight: 700; }

  /* ── SHARED COMPONENTS ── */
  h2 {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 1rem;
  }
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }
  .word-count { font-size: 0.82rem; color: var(--ink-mute); }

  .btn {
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 0.65rem 1.1rem;
    border: 2px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
    -webkit-appearance: none;
    border-radius: 0;
  }
  .btn:active { opacity: 0.75; }
  .btn.secondary { background: transparent; color: var(--ink); }
  .btn.danger    { border-color: var(--red); background: var(--red); color: #fff; }
  .btn.full      { width: 100%; display: block; text-align: center; padding: 0.85rem; font-size: 0.9rem; }
  .btn:disabled  { opacity: 0.35; }

  /* ── LIBRARY ── */
  .add-form {
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    margin-bottom: 1.2rem;
    padding: 1rem;
    background: var(--paper-2);
    border: 1px solid var(--rule);
  }
  .add-form input, .add-form select {
    font-family: 'Inter', sans-serif;
    font-size: 1rem; /* >= 16px to prevent iOS zoom */
    padding: 0.65rem 0.8rem;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    outline: none;
    -webkit-appearance: none;
    border-radius: 0;
    width: 100%;
  }
  .add-form input:focus, .add-form select:focus { border-color: var(--ink); }
  .add-form input::placeholder { color: var(--ink-mute); }
  .add-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }

  .vocab-list { border: 1px solid var(--rule); }
  .vocab-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--rule);
    background: var(--paper);
  }
  .vocab-item:last-child { border-bottom: none; }
  .vocab-jp {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.2rem;
    font-weight: 700;
    min-width: 2.5rem;
  }
  .vocab-info { flex: 1; min-width: 0; }
  .vocab-en { font-size: 0.88rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vocab-reading { font-family: 'Noto Serif JP', serif; font-size: 0.75rem; color: var(--ink-mute); }
  .tag {
    display: inline-block;
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 0.12rem 0.4rem;
    border: 1px solid var(--rule);
    color: var(--ink-mute);
    flex-shrink: 0;
  }
  .del-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--ink-mute);
    font-size: 1.1rem;
    padding: 0.3rem 0.4rem;
    flex-shrink: 0;
  }
  .empty-state {
    text-align: center;
    color: var(--ink-mute);
    padding: 3rem 1rem;
    font-size: 0.9rem;
    border: 1px dashed var(--rule);
  }
  .empty-state .big { font-family: 'Noto Serif JP', serif; font-size: 3rem; margin-bottom: 0.5rem; }
  .io-row { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
  .io-row .btn { flex: 1; text-align: center; font-size: 0.75rem; padding: 0.6rem 0.5rem; }
  .file-input { display: none; }

  /* ── GAME ── */
  .setup-row {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    margin-bottom: 1rem;
  }
  .setup-row label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
  .setup-row select, .setup-row input[type="number"] {
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    padding: 0.7rem 0.85rem;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    outline: none;
    -webkit-appearance: none;
    border-radius: 0;
    width: 100%;
  }
  .setup-divider { border: none; border-top: 1px solid var(--rule); margin: 1.2rem 0; }
  .hint { font-size: 0.76rem; color: var(--ink-mute); margin-top: 0.3rem; }

  /* active game */
  .game-active { display: none; }
  .game-progress {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    font-size: 0.75rem;
    color: var(--ink-mute);
    letter-spacing: 0.04em;
  }
  .progress-bar-wrap { flex: 1; height: 3px; background: var(--rule); margin: 0 0.8rem; }
  .progress-bar      { height: 100%; background: var(--ink); transition: width 0.3s; }

  .card {
    border: 2px solid var(--ink);
    padding: 2rem 1.2rem;
    text-align: center;
    margin-bottom: 1rem;
    position: relative;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    background: var(--paper);
  }
  .card-label {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-mute);
    position: absolute;
    top: 0.7rem; left: 0.9rem;
  }
  .card-type-badge { position: absolute; top: 0.7rem; right: 0.9rem; }
  .card-main {
    font-family: 'Noto Serif JP', serif;
    font-size: 2.8rem;
    font-weight: 700;
    line-height: 1.1;
  }
  .card-main.en {
    font-family: 'Inter', sans-serif;
    font-size: 1.7rem;
    font-weight: 300;
  }
  .card-reading { font-family: 'Noto Serif JP', serif; font-size: 0.95rem; color: var(--ink-soft); }
  .speak-btn {
    background: none;
    border: 1px solid var(--rule);
    padding: 0.3rem 0.75rem;
    cursor: pointer;
    color: var(--ink-mute);
    font-size: 0.8rem;
    margin-top: 0.2rem;
  }

  .answer-row { display: flex; gap: 0.5rem; margin-bottom: 0.8rem; }
  .answer-input {
    flex: 1;
    font-family: 'Noto Serif JP', serif;
    font-size: 1.1rem;
    padding: 0.7rem 0.9rem;
    border: 2px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    outline: none;
    -webkit-appearance: none;
    border-radius: 0;
    transition: border-color 0.15s;
  }
  .answer-input:focus  { border-color: var(--ink); }
  .answer-input.correct { border-color: var(--green); background: #f0f7f5; }
  .answer-input.wrong   { border-color: var(--red);   background: #fdf3f2; }

  .feedback-box {
    padding: 0.8rem 1rem;
    margin-bottom: 0.8rem;
    font-size: 0.88rem;
    display: none;
  }
  .feedback-box.correct { background: #e8f4f0; border-left: 4px solid var(--green); color: var(--green); }
  .feedback-box.wrong   { background: #fdecea; border-left: 4px solid var(--red);   color: var(--red); }

  .game-controls { display: flex; gap: 0.5rem; flex-wrap: wrap; }

  /* results */
  .game-results { display: none; text-align: center; padding-top: 1rem; }
  .results-score {
    font-family: 'Noto Serif JP', serif;
    font-size: 5rem;
    font-weight: 700;
    line-height: 1;
    margin: 1rem 0 0.3rem;
  }
  .results-label { color: var(--ink-mute); font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; }
  .results-detail { margin: 1rem 0 1.5rem; color: var(--ink-soft); font-size: 0.85rem; }
  .results-breakdown {
    text-align: left;
    border: 1px solid var(--rule);
    margin-bottom: 1.5rem;
    max-height: 260px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .results-breakdown table { width: 100%; border-collapse: collapse; }
  .results-breakdown th {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-mute);
    padding: 0.45rem 0.6rem;
    border-bottom: 1px solid var(--rule);
    text-align: left;
  }
  .results-breakdown td { padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--rule); font-size: 0.84rem; }
  .results-breakdown tr:last-child td { border-bottom: none; }
  .correct-mark { color: var(--green); font-weight: 700; }
  .wrong-mark   { color: var(--red);   font-weight: 700; }
  .results-btns { display: flex; gap: 0.5rem; justify-content: center; }

  /* ── HISTORY ── */
  .history-empty { text-align: center; color: var(--ink-mute); padding: 3rem 1rem; font-size: 0.9rem; }
  .history-list  { border: 1px solid var(--rule); }
  .history-item {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 0.8rem;
    padding: 0.8rem 0.9rem;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
  }
  .history-item:last-child { border-bottom: none; }
  .history-item:active { background: var(--paper-2); }
  .history-date { font-size: 0.72rem; color: var(--ink-mute); }
  .history-meta { font-size: 0.83rem; }
  .history-mode { font-size: 0.68rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-mute); }
  .history-score-pill {
    font-size: 0.78rem;
    font-weight: 700;
    padding: 0.22rem 0.6rem;
    border-radius: 100px;
  }
  .pill-good { background: #e8f4f0; color: var(--green); }
  .pill-mid  { background: #fef9ec; color: #8a6d00; }
  .pill-bad  { background: #fdecea; color: var(--red); }

  /* modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--paper);
    border-top: 2px solid var(--ink);
    padding: 1.5rem 1.2rem;
    padding-bottom: calc(1.5rem + var(--safe-b));
    width: 100%;
    max-height: 75vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    padding-bottom: 0.7rem;
    border-bottom: 1px solid var(--rule);
  }
  .modal-close {
    background: none;
    border: none;
    font-size: 1.3rem;
    cursor: pointer;
    color: var(--ink-mute);
    padding: 0.2rem;
  }
  .modal-table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  .modal-table th {
    text-align: left;
    padding: 0.4rem 0.5rem;
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-mute);
    border-bottom: 1px solid var(--rule);
  }
  .modal-table td { padding: 0.45rem 0.5rem; border-bottom: 1px solid var(--rule); }
  .modal-table tr:last-child td { border-bottom: none; }
</style>
</head>
<body>

<!-- TOP HEADER -->
<div class="app-header">
  <div>
    <div class="app-title">日本語 <span>Flash</span></div>
    <div class="app-subtitle">Vocabulary Trainer</div>
  </div>
</div>

<!-- SCROLLABLE CONTENT -->
<div class="view-scroll">

  <!-- ══════════════════════ LIBRARY ══════ -->
  <div id="view-library" class="view active">
    <div class="section-header">
      <h2>Library</h2>
      <span class="word-count" id="word-count">0 words</span>
    </div>

    <div class="add-form">
      <input id="inp-jp"      type="text" placeholder="日本語 (kana / kanji)"
             autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="none">
      <div class="add-form-row">
        <input id="inp-reading" type="text" placeholder="Reading (if kanji)"
               autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="none">
        <select id="inp-type">
          <option value="">Type…</option>
          <option value="noun">Noun</option>
          <option value="verb">Verb</option>
          <option value="i-adj">い-adj</option>
          <option value="na-adj">な-adj</option>
          <option value="adverb">Adverb</option>
          <option value="particle">Particle</option>
          <option value="expression">Expression</option>
          <option value="other">Other</option>
        </select>
      </div>
      <input id="inp-en" type="text" placeholder="Meaning (English)"
             autocomplete="off" autocorrect="off">
      <button class="btn full" onclick="addWord()">+ Add Word</button>
    </div>

    <div id="vocab-list-wrap"></div>

    <div class="io-row">
      <label class="btn secondary" style="cursor:pointer;display:flex;align-items:center;justify-content:center;">
        Import JSON
        <input type="file" class="file-input" id="import-file" accept=".json" onchange="importVocab(event)">
      </label>
      <button class="btn secondary" onclick="exportVocab()">Export JSON</button>
    </div>
  </div>

  <!-- ══════════════════════ GAME ══════ -->
  <div id="view-game" class="view">

    <!-- Setup -->
    <div id="game-setup">
      <h2>Practice</h2>

      <div class="setup-row">
        <label>Direction</label>
        <select id="cfg-direction">
          <option value="jp-to-en">JP → EN (read Japanese, type meaning)</option>
          <option value="en-to-jp">EN → JP (read meaning, type Japanese)</option>
          <option value="random">Random mix</option>
        </select>
      </div>

      <div class="setup-row">
        <label>Number of Cards</label>
        <input type="number" id="cfg-count" value="10" min="1" max="500" inputmode="numeric">
        <div class="hint">Set to 0 to use all words.</div>
      </div>

      <div class="setup-row">
        <label>Filter by Type</label>
        <select id="cfg-type-filter">
          <option value="">All types</option>
          <option value="noun">Noun</option>
          <option value="verb">Verb</option>
          <option value="i-adj">い-adj</option>
          <option value="na-adj">な-adj</option>
          <option value="adverb">Adverb</option>
          <option value="particle">Particle</option>
          <option value="expression">Expression</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="setup-row">
        <label>Answer Matching</label>
        <select id="cfg-strict">
          <option value="loose">Loose — accept close matches</option>
          <option value="strict">Strict — exact match only</option>
        </select>
      </div>

      <hr class="setup-divider">
      <button class="btn full" onclick="startGame()" id="start-btn">Start Session →</button>
      <div class="hint" id="setup-hint" style="margin-top:0.6rem;text-align:center;"></div>
    </div>

    <!-- Active game -->
    <div class="game-active" id="game-active">
      <div class="game-progress">
        <span id="prog-label">1 / 10</span>
        <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar" style="width:0%"></div></div>
        <span id="score-label">✓ 0 &nbsp;✗ 0</span>
      </div>

      <div class="card" id="game-card">
        <span class="card-label" id="card-direction-label"></span>
        <span class="card-type-badge" id="card-type-badge"></span>
        <div class="card-main" id="card-prompt"></div>
        <div class="card-reading" id="card-reading"></div>
        <button class="speak-btn" id="speak-btn" onclick="speakCard()">🔊 Hear it</button>
      </div>

      <div class="feedback-box" id="feedback-box"></div>

      <div class="answer-row">
        <input class="answer-input" id="answer-input"
               placeholder="Type answer, tap Submit…"
               autocomplete="off" spellcheck="false"
               autocorrect="off" autocapitalize="none"
               onkeydown="if(event.key==='Enter') submitAnswer()">
        <button class="btn" id="submit-btn" onclick="submitAnswer()">Submit</button>
      </div>

      <div class="game-controls">
        <button class="btn secondary" id="next-btn" onclick="nextCard()" style="display:none">Next →</button>
        <button class="btn secondary" onclick="skipCard()" id="skip-btn">Skip</button>
        <button class="btn danger" onclick="confirmAbandon()" style="margin-left:auto">Quit</button>
      </div>
    </div>

    <!-- Results -->
    <div class="game-results" id="game-results">
      <div class="results-score" id="res-score"></div>
      <div class="results-label">Correct</div>
      <div class="results-detail" id="res-detail"></div>
      <div class="results-breakdown" id="res-breakdown"></div>
      <div class="results-btns">
        <button class="btn" onclick="startGame()">Play Again</button>
        <button class="btn secondary" onclick="backToSetup()">Settings</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════ HISTORY ══════ -->
  <div id="view-history" class="view">
    <div class="section-header">
      <h2>History</h2>
      <button class="btn danger" onclick="clearHistory()"
              style="font-size:0.72rem;padding:0.38rem 0.7rem;">Clear</button>
    </div>
    <div id="history-wrap"></div>
  </div>

</div><!-- end view-scroll -->

<!-- BOTTOM TAB BAR -->
<div class="tab-bar">
  <button class="tab-btn active" id="tab-library" onclick="showView('library',this)">
    <span class="tab-icon">本</span>
    <span class="tab-label">Library</span>
  </button>
  <button class="tab-btn" id="tab-game" onclick="showView('game',this)">
    <span class="tab-icon">✎</span>
    <span class="tab-label">Practice</span>
  </button>
  <button class="tab-btn" id="tab-history" onclick="showView('history',this)">
    <span class="tab-icon">📋</span>
    <span class="tab-label">History</span>
  </button>
</div>

<!-- HISTORY DETAIL MODAL (slides up from bottom) -->
<div class="modal-overlay" id="history-modal" onclick="closeModal(event)">
  <div class="modal-box">
    <div class="modal-header">
      <strong id="modal-title" style="font-size:0.9rem;"></strong>
      <button class="modal-close"
              onclick="document.getElementById('history-modal').classList.remove('open')">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
/* ─── STORAGE KEYS ─── */
const KEY_VOCAB   = 'nihongo_flash_vocab';
const KEY_HISTORY = 'nihongo_flash_history';

/* ─── STATE ─── */
let vocab   = JSON.parse(localStorage.getItem(KEY_VOCAB)   || '[]');
let history = JSON.parse(localStorage.getItem(KEY_HISTORY) || '[]');
let session = null;

/* ─── NAV ─── */
function showView(name, tabEl) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  if (tabEl) tabEl.classList.add('active');
  // Scroll back to top on tab switch
  document.querySelector('.view-scroll').scrollTop = 0;
  if (name === 'library') renderVocabList();
  if (name === 'history') renderHistory();
  if (name === 'game' && !session) updateSetupHint();
}

/* ─── LIBRARY ─── */
function saveVocab() { localStorage.setItem(KEY_VOCAB, JSON.stringify(vocab)); }

function addWord() {
  const jp      = document.getElementById('inp-jp').value.trim();
  const reading = document.getElementById('inp-reading').value.trim();
  const en      = document.getElementById('inp-en').value.trim();
  const type    = document.getElementById('inp-type').value;
  if (!jp || !en) { alert('Japanese and Meaning are required.'); return; }
  vocab.push({ id: Date.now(), jp, reading, en, type });
  saveVocab();
  renderVocabList();
  ['inp-jp','inp-reading','inp-en'].forEach(id => document.getElementById(id).value = '');
  updateSetupHint();
}

function deleteWord(id) {
  if (!confirm('Remove this entry?')) return;
  vocab = vocab.filter(w => w.id !== id);
  saveVocab();
  renderVocabList();
  updateSetupHint();
}

function renderVocabList() {
  const wrap = document.getElementById('vocab-list-wrap');
  document.getElementById('word-count').textContent =
    vocab.length + ' word' + (vocab.length !== 1 ? 's' : '');

  if (!vocab.length) {
    wrap.innerHTML = `<div class="empty-state">
      <div class="big">語</div>Add your first word above.</div>`;
    return;
  }
  const list = document.createElement('div');
  list.className = 'vocab-list';
  vocab.forEach(w => {
    const item = document.createElement('div');
    item.className = 'vocab-item';
    item.innerHTML = `
      <div class="vocab-jp">${esc(w.jp)}</div>
      <div class="vocab-info">
        <div class="vocab-en">${esc(w.en)}</div>
        ${w.reading ? `<div class="vocab-reading">${esc(w.reading)}</div>` : ''}
      </div>
      ${w.type ? `<span class="tag">${esc(w.type)}</span>` : ''}
      <button class="del-btn" onclick="deleteWord(${w.id})">✕</button>`;
    list.appendChild(item);
  });
  wrap.innerHTML = '';
  wrap.appendChild(list);
}

function exportVocab() {
  const blob = new Blob([JSON.stringify(vocab, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nihongo_vocab.json';
  a.click();
}

function importVocab(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error();
      const imported = data.filter(w => w.jp && w.en).map(w => ({
        id: Date.now() + Math.random(),
        jp: w.jp, reading: w.reading || '', en: w.en, type: w.type || ''
      }));
      vocab = vocab.concat(imported);
      saveVocab();
      renderVocabList();
      alert(`Imported ${imported.length} words.`);
    } catch { alert('Invalid JSON file.'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

/* ─── GAME SETUP ─── */
function updateSetupHint() {
  const hint     = document.getElementById('setup-hint');
  const startBtn = document.getElementById('start-btn');
  if (!hint) return;
  const tf   = document.getElementById('cfg-type-filter')?.value || '';
  const pool = tf ? vocab.filter(w => w.type === tf) : vocab;
  if (!pool.length) {
    hint.textContent = vocab.length === 0
      ? 'Add words in the Library tab first.'
      : 'No words match the selected type.';
    startBtn.disabled = true;
  } else {
    hint.textContent = `${pool.length} word${pool.length !== 1 ? 's' : ''} available.`;
    startBtn.disabled = false;
  }
}
document.getElementById('cfg-type-filter').addEventListener('change', updateSetupHint);

function startGame() {
  const direction  = document.getElementById('cfg-direction').value;
  const countRaw   = parseInt(document.getElementById('cfg-count').value) || 0;
  const typeFilter = document.getElementById('cfg-type-filter').value;
  const strict     = document.getElementById('cfg-strict').value === 'strict';

  let pool = typeFilter ? vocab.filter(w => w.type === typeFilter) : [...vocab];
  if (!pool.length) { alert('No words to practice.'); return; }

  pool = pool.sort(() => Math.random() - 0.5);
  if (countRaw > 0) pool = pool.slice(0, countRaw);

  const cards = pool.map(w => {
    let dir = direction;
    if (dir === 'random') dir = Math.random() < 0.5 ? 'jp-to-en' : 'en-to-jp';
    return { word: w, direction: dir, result: null, userAnswer: '' };
  });

  session = { cards, idx: 0, correct: 0, wrong: 0, strict,
              direction, startTime: Date.now() };

  document.getElementById('game-setup').style.display   = 'none';
  document.getElementById('game-results').style.display = 'none';
  document.getElementById('game-active').style.display  = 'block';
  document.querySelector('.view-scroll').scrollTop = 0;

  showCard();
}

function backToSetup() {
  session = null;
  document.getElementById('game-setup').style.display   = 'block';
  document.getElementById('game-results').style.display = 'none';
  document.getElementById('game-active').style.display  = 'none';
  updateSetupHint();
}

/* ─── GAME LOGIC ─── */
function showCard() {
  const { cards, idx } = session;
  const card = cards[idx];
  const total = cards.length;

  document.getElementById('prog-label').textContent = `${idx + 1} / ${total}`;
  document.getElementById('prog-bar').style.width   = `${(idx / total) * 100}%`;
  document.getElementById('score-label').innerHTML  = `✓ ${session.correct} &nbsp;✗ ${session.wrong}`;

  const isJpToEn = card.direction === 'jp-to-en';
  document.getElementById('card-direction-label').textContent =
    isJpToEn ? 'Japanese → English' : 'English → Japanese';

  const prompt = document.getElementById('card-prompt');
  if (isJpToEn) {
    prompt.textContent = card.word.jp;
    prompt.className   = 'card-main';
    document.getElementById('card-reading').textContent = card.word.reading || '';
    document.getElementById('speak-btn').style.display  = '';
  } else {
    prompt.textContent = card.word.en;
    prompt.className   = 'card-main en';
    document.getElementById('card-reading').textContent = '';
    document.getElementById('speak-btn').style.display  = 'none';
  }

  const badge = document.getElementById('card-type-badge');
  badge.innerHTML = card.word.type ? `<span class="tag">${esc(card.word.type)}</span>` : '';

  const input = document.getElementById('answer-input');
  input.value     = '';
  input.className = 'answer-input';
  input.disabled  = false;
  input.placeholder = isJpToEn ? 'Type the English meaning…' : 'Type in Japanese…';

  document.getElementById('feedback-box').style.display = 'none';
  document.getElementById('next-btn').style.display  = 'none';
  document.getElementById('skip-btn').style.display  = '';
  document.getElementById('submit-btn').disabled     = false;
}

function submitAnswer() {
  const input   = document.getElementById('answer-input');
  const userRaw = input.value.trim();
  if (!userRaw) return;

  const card    = session.cards[session.idx];
  const correct = checkAnswer(card, userRaw);

  card.result     = correct ? 'correct' : 'wrong';
  card.userAnswer = userRaw;
  if (correct) session.correct++; else session.wrong++;

  input.className = 'answer-input ' + (correct ? 'correct' : 'wrong');
  input.disabled  = true;
  document.getElementById('submit-btn').disabled = true;

  const fb = document.getElementById('feedback-box');
  fb.style.display = 'block';
  const isJpToEn   = card.direction === 'jp-to-en';
  const expected   = isJpToEn ? card.word.en : card.word.jp;
  const readingNote = (!isJpToEn && card.word.reading)
    ? ` <span style="color:var(--ink-soft);font-size:0.85em;">(${esc(card.word.reading)})</span>` : '';

  if (correct) {
    fb.className = 'feedback-box correct';
    fb.innerHTML = `✓ Correct!`;
  } else {
    fb.className = 'feedback-box wrong';
    fb.innerHTML = `✗ Answer: <strong style="font-family:'Noto Serif JP',serif">${esc(expected)}${readingNote}</strong>`;
  }

  document.getElementById('skip-btn').style.display = 'none';
  if (session.idx + 1 < session.cards.length) {
    document.getElementById('next-btn').style.display = '';
    if (correct) setTimeout(nextCard, 900);
  } else {
    setTimeout(finishGame, correct ? 900 : 1400);
  }
}

function skipCard() {
  session.cards[session.idx].result = 'skip';
  session.cards[session.idx].userAnswer = '';
  session.wrong++;
  nextCard();
}

function nextCard() {
  session.idx++;
  if (session.idx < session.cards.length) showCard();
  else finishGame();
}

function checkAnswer(card, userRaw) {
  const isJpToEn = card.direction === 'jp-to-en';
  const expected = isJpToEn ? card.word.en : card.word.jp;
  if (session.strict) return normalize(userRaw) === normalize(expected);
  const targets = expected.split(/[,、\/]/).map(s => normalize(s.trim()));
  const user    = normalize(userRaw);
  return targets.some(t => t === user || levenshtein(t, user) <= 1);
}

function normalize(s) {
  return s.toLowerCase().replace(/[^\p{L}\p{N}ー]/gu, '').trim();
}

function levenshtein(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  const dp = Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i||j));
  for (let i=1;i<=m;i++) for (let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}

function confirmAbandon() {
  if (confirm('Quit this session? Progress will not be saved.')) backToSetup();
}

/* ─── FINISH ─── */
function finishGame() {
  document.getElementById('game-active').style.display  = 'none';
  document.getElementById('game-results').style.display = 'block';
  document.querySelector('.view-scroll').scrollTop = 0;

  const total   = session.cards.length;
  const correct = session.correct;
  const pct     = Math.round((correct / total) * 100);

  document.getElementById('res-score').textContent  = pct + '%';
  document.getElementById('res-detail').textContent =
    `${correct} / ${total} correct · ${directionLabel(session.direction)}`;

  const tb = document.createElement('table');
  tb.innerHTML = `<thead><tr>
    <th>Prompt</th><th>Your Answer</th><th>Correct</th><th></th>
  </tr></thead>`;
  const tbody = document.createElement('tbody');
  session.cards.forEach(c => {
    const isJpToEn = c.direction === 'jp-to-en';
    const prompt   = isJpToEn ? c.word.jp : c.word.en;
    const expected = isJpToEn ? c.word.en : c.word.jp;
    const mark = c.result === 'correct'
      ? `<span class="correct-mark">✓</span>` : `<span class="wrong-mark">✗</span>`;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="font-family:'Noto Serif JP',serif">${esc(prompt)}</td>
      <td style="color:var(--ink-soft)">${esc(c.userAnswer||'—')}</td>
      <td style="font-family:'Noto Serif JP',serif">${esc(expected)}</td>
      <td>${mark}</td>`;
    tbody.appendChild(tr);
  });
  tb.appendChild(tbody);
  const wrap = document.getElementById('res-breakdown');
  wrap.innerHTML = '';
  wrap.appendChild(tb);

  const record = {
    id: Date.now(), date: new Date().toISOString(),
    direction: session.direction, total, correct, pct,
    durationMs: Date.now() - session.startTime,
    cards: session.cards.map(c => ({
      jp: c.word.jp, en: c.word.en,
      direction: c.direction, result: c.result, userAnswer: c.userAnswer
    }))
  };
  history.unshift(record);
  if (history.length > 100) history = history.slice(0, 100);
  localStorage.setItem(KEY_HISTORY, JSON.stringify(history));
}

function directionLabel(d) {
  return d === 'jp-to-en' ? 'JP→EN' : d === 'en-to-jp' ? 'EN→JP' : 'Mixed';
}

/* ─── SPEECH ─── */
function speakCard() {
  if (!('speechSynthesis' in window)) { alert('Speech not supported.'); return; }
  const card = session?.cards[session.idx];
  if (!card) return;
  const utt  = new SpeechSynthesisUtterance(card.word.jp);
  utt.lang   = 'ja-JP';
  utt.rate   = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(utt);
}

/* ─── HISTORY ─── */
function renderHistory() {
  const wrap = document.getElementById('history-wrap');
  if (!history.length) {
    wrap.innerHTML = `<div class="history-empty">No sessions yet. Play a game to see history here.</div>`;
    return;
  }
  const list = document.createElement('div');
  list.className = 'history-list';
  history.forEach(rec => {
    const pillClass = rec.pct >= 80 ? 'pill-good' : rec.pct >= 50 ? 'pill-mid' : 'pill-bad';
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `
      <div>
        <div class="history-meta">${rec.total} cards · ${directionLabel(rec.direction)}</div>
        <div class="history-date">${formatDate(rec.date)} · ${formatDuration(rec.durationMs)}</div>
      </div>
      <span class="history-score-pill ${pillClass}">${rec.pct}%</span>
      <span style="color:var(--ink-mute)">›</span>`;
    item.onclick = () => openHistoryDetail(rec);
    list.appendChild(item);
  });
  wrap.innerHTML = '';
  wrap.appendChild(list);
}

function openHistoryDetail(rec) {
  document.getElementById('modal-title').textContent =
    `${formatDate(rec.date)} · ${rec.pct}% (${rec.correct}/${rec.total})`;
  const tb = document.createElement('table');
  tb.className = 'modal-table';
  tb.innerHTML = `<thead><tr>
    <th>Prompt</th><th>Answer</th><th>Correct</th><th></th>
  </tr></thead>`;
  const tbody = document.createElement('tbody');
  rec.cards.forEach(c => {
    const isJpToEn = c.direction === 'jp-to-en';
    const prompt   = isJpToEn ? c.jp : c.en;
    const expected = isJpToEn ? c.en : c.jp;
    const mark = c.result === 'correct'
      ? `<span class="correct-mark">✓</span>` : `<span class="wrong-mark">✗</span>`;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="font-family:'Noto Serif JP',serif">${esc(prompt)}</td>
      <td style="color:var(--ink-soft)">${esc(c.userAnswer||'—')}</td>
      <td style="font-family:'Noto Serif JP',serif">${esc(expected)}</td>
      <td>${mark}</td>`;
    tbody.appendChild(tr);
  });
  tb.appendChild(tbody);
  const body = document.getElementById('modal-body');
  body.innerHTML = '';
  body.appendChild(tb);
  document.getElementById('history-modal').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('history-modal'))
    document.getElementById('history-modal').classList.remove('open');
}

function clearHistory() {
  if (!confirm('Delete all history?')) return;
  history = [];
  localStorage.setItem(KEY_HISTORY, JSON.stringify(history));
  renderHistory();
}

/* ─── UTILS ─── */
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})
    + ' ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function formatDuration(ms) {
  const s = Math.round(ms/1000);
  return s < 60 ? `${s}s` : `${Math.floor(s/60)}m ${s%60}s`;
}

/* ─── SERVICE WORKER (offline support) ─── */
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'nihongo-flash-v1';
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll([
        'https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Inter:wght@300;400;500;600&display=swap'
      ]).catch(()=>{})));
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(caches.keys().then(keys =>
        Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));
      self.clients.claim();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.match(e.request).then(r => r || fetch(e.request).then(res => {
          if (e.request.url.includes('fonts.')) {
            const clone = res.clone();
            caches.open(CACHE).then(c => c.put(e.request, clone));
          }
          return res;
        }).catch(() => new Response('', {status: 503})))
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}

/* ─── INIT ─── */
renderVocabList();
updateSetupHint();
</script>
</body>
